name: Apply Court Zoom and Parquet

on:
  push:
    branches:
      - agent/court-zoom-parquet

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/court-zoom-parquet
          fetch-depth: 0

      - name: Patch renderer and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          rendering = Path('js/play-designer/rendering.js')
          source = rendering.read_text(encoding='utf-8')

          source = re.sub(
              r"export const COURT_VIEW = Object\.freeze\(\{.*?\n\}\);",
              """export const COURT_VIEW = Object.freeze({
            width: 760,
            height: 550,
            centerX: 380,
            farY: 54,
            nearY: 506,
            farHalfWidth: 340,
            nearHalfWidth: 340,
            yPower: 0.92,
            minZoom: 1,
            maxZoom: 3.5
          });""",
              source,
              count=1,
              flags=re.S,
          )

          source = re.sub(
              r"export function projectPoint\(value\) \{.*?\n\}\n\nexport function unprojectPoint",
              """export function projectPoint(value) {
            const x = Number(value?.x ?? 250);
            const y = Number(value?.y ?? 235);
            const t = clamp01(y / 470);
            return {
              x: COURT_VIEW.centerX + ((x - 250) / 250) * COURT_VIEW.nearHalfWidth,
              y: COURT_VIEW.farY
                + (COURT_VIEW.nearY - COURT_VIEW.farY) * Math.pow(t, COURT_VIEW.yPower),
              depth: t,
              scale: depthScale(y)
            };
          }

          export function unprojectPoint""",
              source,
              count=1,
              flags=re.S,
          )

          source = re.sub(
              r"export function unprojectPoint\(value\) \{.*?\n\}\n\nexport function depthScale",
              """export function unprojectPoint(value) {
            const projectedY = clamp01(
              (Number(value?.y ?? COURT_VIEW.farY) - COURT_VIEW.farY)
                / (COURT_VIEW.nearY - COURT_VIEW.farY)
            );
            const t = Math.pow(projectedY, 1 / COURT_VIEW.yPower);
            return {
              x: core.clamp(
                250 + ((Number(value?.x ?? COURT_VIEW.centerX) - COURT_VIEW.centerX)
                  / COURT_VIEW.nearHalfWidth) * 250,
                16,
                484
              ),
              y: core.clamp(t * 470, 16, 454)
            };
          }

          export function depthScale""",
              source,
              count=1,
              flags=re.S,
          )

          source = re.sub(
              r"export function depthScale\(y\) \{.*?\n\}",
              """export function depthScale(y) {
            return 0.88 + clamp01((Number(y) || 0) / 470) * 0.16;
          }""",
              source,
              count=1,
              flags=re.S,
          )

          parquet = r'''
          function drawParquet(base) {
            const colors = [
              'rgba(255,244,213,.075)',
              'rgba(112,54,18,.055)',
              'rgba(255,224,174,.045)',
              'rgba(91,43,14,.035)',
              'rgba(255,250,230,.055)'
            ];
            const plankWidth = 24;
            const plankLength = 62;
            let plankIndex = 0;

            for (let x = 10; x < 490; x += plankWidth) {
              const column = Math.floor((x - 10) / plankWidth);
              const offset = -((column % 3) * 21);
              for (let y = 10 + offset; y < 460; y += plankLength) {
                const y1 = Math.max(10, y);
                const y2 = Math.min(460, y + plankLength);
                if (y2 - y1 < 5) continue;
                const x2 = Math.min(490, x + plankWidth);
                polygon(base, [
                  { x, y: y1 },
                  { x: x2, y: y1 },
                  { x: x2, y: y2 },
                  { x, y: y2 }
                ], {
                  fill: colors[(column * 7 + plankIndex * 3) % colors.length],
                  stroke: 'rgba(89,43,16,.16)',
                  'stroke-width': .55,
                  'data-parquet-plank': String(plankIndex)
                });

                if ((plankIndex + column) % 3 === 0) {
                  const grainY = y1 + (y2 - y1) * .58;
                  baseLine(base, [
                    { x: x + 4, y: grainY },
                    { x: Math.min(x2 - 4, x + 17), y: grainY + 1.5 }
                  ], {
                    stroke: 'rgba(92,43,13,.18)',
                    'stroke-width': .7,
                    opacity: .65,
                    'data-wood-grain': String(plankIndex)
                  });
                }
                plankIndex += 1;
              }
            }
          }
          '''
          source = source.replace('function buildCourtBase(svg) {', parquet + '\nfunction buildCourtBase(svg) {', 1)

          source = re.sub(
              r"  for \(let x = 10, index = 0; x < 490; x \+= 40, index \+= 1\) \{.*?\n  polygon\(base, \[",
              "  drawParquet(base);\n\n  polygon(base, [",
              source,
              count=1,
              flags=re.S,
          )

          source = source.replace(
              """      <linearGradient id="${prefix}-floor" x1="0" y1="0" x2="1" y2=".82">
                <stop offset="0" stop-color="#d7a15e"/>
                <stop offset=".24" stop-color="#f0c37b"/>
                <stop offset=".5" stop-color="#c98943"/>
                <stop offset=".76" stop-color="#edbd70"/>
                <stop offset="1" stop-color="#bd7739"/>
              </linearGradient>""",
              """      <linearGradient id="${prefix}-floor" x1="0" y1="0" x2=".18" y2="1">
                <stop offset="0" stop-color="#dba65f"/>
                <stop offset=".34" stop-color="#e8b96f"/>
                <stop offset=".68" stop-color="#d49a52"/>
                <stop offset="1" stop-color="#e4b36a"/>
              </linearGradient>""",
              1,
          )

          zoom_code = r'''
          function clampValue(value, min, max) {
            return Math.max(min, Math.min(max, Number(value) || 0));
          }

          function currentViewBox(svg) {
            const raw = (svg.getAttribute('viewBox') || '').trim().split(/\s+/).map(Number);
            if (raw.length === 4 && raw.every(Number.isFinite)) {
              return { x: raw[0], y: raw[1], width: raw[2], height: raw[3] };
            }
            return { x: 0, y: 0, width: COURT_VIEW.width, height: COURT_VIEW.height };
          }

          function clientFraction(svg, clientX, clientY, viewBox = currentViewBox(svg)) {
            const rect = svg.getBoundingClientRect();
            const scale = Math.min(rect.width / viewBox.width, rect.height / viewBox.height) || 1;
            const renderedWidth = viewBox.width * scale;
            const renderedHeight = viewBox.height * scale;
            const offsetX = (rect.width - renderedWidth) / 2;
            const offsetY = (rect.height - renderedHeight) / 2;
            return {
              x: clampValue((clientX - rect.left - offsetX) / renderedWidth, 0, 1),
              y: clampValue((clientY - rect.top - offsetY) / renderedHeight, 0, 1)
            };
          }

          function clientToSvg(svg, clientX, clientY) {
            const viewBox = currentViewBox(svg);
            const fraction = clientFraction(svg, clientX, clientY, viewBox);
            return {
              x: viewBox.x + fraction.x * viewBox.width,
              y: viewBox.y + fraction.y * viewBox.height
            };
          }

          export function setupCourtViewport(svg) {
            if (svg.__courtViewport) return svg.__courtViewport;

            let zoom = 1;
            let centerX = COURT_VIEW.width / 2;
            let centerY = COURT_VIEW.height / 2;
            let gesture = null;
            const pointers = new Map();

            function emitZoom() {
              const Custom = svg.ownerDocument.defaultView?.CustomEvent || globalThis.CustomEvent;
              if (Custom) svg.dispatchEvent(new Custom('court-zoom-change', { detail: { zoom } }));
            }

            function apply() {
              const width = COURT_VIEW.width / zoom;
              const height = COURT_VIEW.height / zoom;
              centerX = clampValue(centerX, width / 2, COURT_VIEW.width - width / 2);
              centerY = clampValue(centerY, height / 2, COURT_VIEW.height - height / 2);
              svg.setAttribute('viewBox', `${centerX - width / 2} ${centerY - height / 2} ${width} ${height}`);
              svg.dataset.zoom = zoom.toFixed(2);
              emitZoom();
            }

            function setFromAnchor(nextZoom, anchor, clientX, clientY) {
              zoom = clampValue(nextZoom, COURT_VIEW.minZoom, COURT_VIEW.maxZoom);
              const width = COURT_VIEW.width / zoom;
              const height = COURT_VIEW.height / zoom;
              const fraction = clientFraction(svg, clientX, clientY, { x: 0, y: 0, width, height });
              centerX = anchor.x - fraction.x * width + width / 2;
              centerY = anchor.y - fraction.y * height + height / 2;
              apply();
            }

            function setZoom(nextZoom, focus) {
              const rect = svg.getBoundingClientRect();
              const clientX = focus?.clientX ?? rect.left + rect.width / 2;
              const clientY = focus?.clientY ?? rect.top + rect.height / 2;
              setFromAnchor(nextZoom, clientToSvg(svg, clientX, clientY), clientX, clientY);
            }

            function reset() {
              zoom = 1;
              centerX = COURT_VIEW.width / 2;
              centerY = COURT_VIEW.height / 2;
              apply();
            }

            function beginGesture() {
              if (pointers.size < 2) return;
              const [a, b] = [...pointers.values()];
              const midpoint = { clientX: (a.x + b.x) / 2, clientY: (a.y + b.y) / 2 };
              gesture = {
                startDistance: Math.hypot(a.x - b.x, a.y - b.y) || 1,
                startZoom: zoom,
                anchor: clientToSvg(svg, midpoint.clientX, midpoint.clientY)
              };
            }

            function pointerDown(event) {
              if (event.pointerType !== 'touch') return;
              pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
              if (pointers.size === 2) {
                svg.onpointercancel?.(event);
                beginGesture();
                event.preventDefault();
                event.stopPropagation();
              } else if (pointers.size > 2) {
                event.preventDefault();
                event.stopPropagation();
              }
            }

            function pointerMove(event) {
              if (!pointers.has(event.pointerId)) return;
              pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
              if (!gesture || pointers.size < 2) return;
              const [a, b] = [...pointers.values()];
              const distance = Math.hypot(a.x - b.x, a.y - b.y) || 1;
              const midpoint = { clientX: (a.x + b.x) / 2, clientY: (a.y + b.y) / 2 };
              setFromAnchor(
                gesture.startZoom * distance / gesture.startDistance,
                gesture.anchor,
                midpoint.clientX,
                midpoint.clientY
              );
              event.preventDefault();
              event.stopPropagation();
            }

            function pointerEnd(event) {
              pointers.delete(event.pointerId);
              if (pointers.size < 2) gesture = null;
            }

            svg.addEventListener('pointerdown', pointerDown, true);
            svg.addEventListener('pointermove', pointerMove, true);
            svg.addEventListener('pointerup', pointerEnd, true);
            svg.addEventListener('pointercancel', pointerEnd, true);
            svg.addEventListener('wheel', event => {
              if (!event.ctrlKey && !event.metaKey) return;
              event.preventDefault();
              setZoom(zoom * Math.exp(-event.deltaY * .0025), event);
            }, { passive: false });
            svg.addEventListener('dblclick', event => {
              event.preventDefault();
              if (zoom > 1.05) reset();
              else setZoom(1.8, event);
            });

            const controller = {
              zoomIn: () => setZoom(zoom * 1.28),
              zoomOut: () => setZoom(zoom / 1.28),
              reset,
              getZoom: () => zoom,
              setZoom
            };
            svg.__courtViewport = controller;
            apply();
            return controller;
          }

          function installZoomControls(svg) {
            const parent = svg.parentElement;
            if (!parent || !parent.classList.contains('chpd-court-wrap')) return;
            if (parent.querySelector('[data-role="court-zoom-controls"]')) return;
            const controller = setupCourtViewport(svg);
            const controls = document.createElement('div');
            controls.className = 'chpd-court-zoom';
            controls.dataset.role = 'court-zoom-controls';
            controls.innerHTML = `
              <button type="button" data-zoom="out" aria-label="Spielfeld verkleinern">−</button>
              <button type="button" data-zoom="reset" class="chpd-zoom-value" aria-label="Zoom zurücksetzen">100%</button>
              <button type="button" data-zoom="in" aria-label="Spielfeld vergrößern">＋</button>
            `;
            controls.addEventListener('pointerdown', event => event.stopPropagation());
            controls.addEventListener('click', event => {
              const action = event.target.closest('[data-zoom]')?.dataset.zoom;
              if (action === 'in') controller.zoomIn();
              if (action === 'out') controller.zoomOut();
              if (action === 'reset') controller.reset();
            });
            svg.addEventListener('court-zoom-change', event => {
              const value = controls.querySelector('.chpd-zoom-value');
              if (value) value.textContent = `${Math.round(event.detail.zoom * 100)}%`;
              parent.classList.toggle('is-zoomed', event.detail.zoom > 1.01);
            });
            parent.appendChild(controls);
          }
          '''
          source = source.replace('export function createCourt', zoom_code + '\nexport function createCourt', 1)

          source = source.replace(
              """    'data-perspective': 'true'
            });""",
              """    'data-perspective': 'true',
              'data-projection': 'parallel'
            });""",
              1,
          )
          source = source.replace(
              """  buildCourtBase(svg);
            return svg;""",
              """  buildCourtBase(svg);
            setupCourtViewport(svg);
            queueMicrotask(() => installZoomControls(svg));
            return svg;""",
              1,
          )

          source = re.sub(
              r"export function pointFromEvent\(svg, event\) \{.*?\n\}",
              """export function pointFromEvent(svg, event) {
            return unprojectPoint(clientToSvg(svg, event.clientX, event.clientY));
          }""",
              source,
              count=1,
              flags=re.S,
          )

          rendering.write_text(source, encoding='utf-8')

          styles = Path('js/play-designer/styles.js')
          css = styles.read_text(encoding='utf-8')
          css = css.replace("courthub-play-designer-v3", "courthub-play-designer-v4")
          css = css.replace(
              "document.getElementById('courthub-play-designer-v2')?.remove();",
              "document.getElementById('courthub-play-designer-v2')?.remove();\n  document.getElementById('courthub-play-designer-v3')?.remove();",
              1,
          )
          css = css.replace(
              ".chpd-court[data-perspective=\"true\"]{isolation:isolate}",
              ".chpd-court[data-perspective=\"true\"]{isolation:isolate}\n"
              "    .chpd-court-wrap.is-zoomed{cursor:grab}\n"
              "    .chpd-court-wrap.is-zoomed:active{cursor:grabbing}\n"
              "    .chpd-court-zoom{position:absolute;z-index:5;top:.65rem;right:.65rem;display:flex;align-items:center;gap:.22rem;padding:.25rem;border:1px solid rgba(255,255,255,.16);border-radius:.72rem;background:rgba(4,12,18,.82);box-shadow:0 .55rem 1.4rem rgba(0,0,0,.34);backdrop-filter:blur(.6rem);-webkit-backdrop-filter:blur(.6rem)}\n"
              "    .chpd-court-zoom button{min-width:2.15rem;height:2.15rem;padding:0 .45rem;border:1px solid rgba(255,255,255,.13);border-radius:.5rem;background:#10242d;color:#f8fafc;font-weight:850;cursor:pointer;touch-action:manipulation}\n"
              "    .chpd-court-zoom button:hover{background:#193642}\n"
              "    .chpd-court-zoom .chpd-zoom-value{min-width:3.6rem;font-size:.68rem;color:#d9e7ed}\n"
              "    .chpd-court[data-projection=\"parallel\"]{transform:none}",
              1,
          )
          css = css.replace(
              ".chpd-court-wrap{border-radius:.68rem;max-height:68vh}",
              ".chpd-court-wrap{border-radius:.68rem;max-height:68vh}\n"
              "      .chpd-court-zoom{top:.42rem;right:.42rem;gap:.16rem;padding:.2rem}\n"
              "      .chpd-court-zoom button{min-width:2rem;height:2rem}\n"
              "      .chpd-court-zoom .chpd-zoom-value{min-width:3.25rem}",
              1,
          )
          styles.write_text(css, encoding='utf-8')

          test = Path('scripts/perspective-renderer-smoke.mjs')
          test.write_text("""import { JSDOM } from 'jsdom';
          import { pathToFileURL } from 'node:url';
          import { dirname, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const root = resolve(dirname(fileURLToPath(import.meta.url)), '..');
          const dom = new JSDOM('<!doctype html><html><body></body></html>', { pretendToBeVisual: true });

          globalThis.window = dom.window;
          globalThis.document = dom.window.document;
          globalThis.XMLSerializer = dom.window.XMLSerializer;
          globalThis.CustomEvent = dom.window.CustomEvent;
          window.BT = {
            tactics: {
              __core: {
                clamp: (value, min, max) => Math.max(min, Math.min(max, Number(value) || 0)),
                normalizeTransition: value => value || { motions: [], passes: [], screens: [] },
                elements: (step, type) => (step?.elements || []).filter(item => !type || item.type === type),
                elementById: (step, id) => (step?.elements || []).find(item => item.id === id)
              },
              arrowStyle: () => ({ color: '#b20e19', dash: [] })
            }
          };

          const moduleUrl = pathToFileURL(resolve(root, 'js/play-designer/rendering.js')).href + '?parallel-court-test=1';
          const renderer = await import(moduleUrl);

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          const farLeft = renderer.projectPoint({ x: 10, y: 20 });
          const farRight = renderer.projectPoint({ x: 490, y: 20 });
          const nearLeft = renderer.projectPoint({ x: 10, y: 450 });
          const nearRight = renderer.projectPoint({ x: 490, y: 450 });
          const farWidth = farRight.x - farLeft.x;
          const nearWidth = nearRight.x - nearLeft.x;
          assert(Math.abs(nearWidth - farWidth) < .01, 'Seitenlinien sind nicht parallel');
          assert(nearLeft.y > farLeft.y, 'Geneigte Tiefenachse des Courts ist ungültig');

          for (const point of [{ x: 35, y: 40 }, { x: 250, y: 235 }, { x: 470, y: 430 }]) {
            const roundTrip = renderer.unprojectPoint(renderer.projectPoint(point));
            assert(Math.abs(roundTrip.x - point.x) < .01, 'Inverse X-Projektion ist ungenau');
            assert(Math.abs(roundTrip.y - point.y) < .01, 'Inverse Y-Projektion ist ungenau');
          }

          const court = renderer.createCourt();
          assert(court.dataset.projection === 'parallel', 'Parallele Court-Projektion fehlt');
          assert(court.querySelectorAll('[data-parquet-plank]').length > 80, 'Hallenparkett wird nicht als Holzplanken gerendert');
          assert(court.__courtViewport, 'Court-Zoom-Controller fehlt');
          court.__courtViewport.zoomIn();
          assert(Number(court.dataset.zoom) > 1, 'Zoom-In verändert den Court nicht');
          court.__courtViewport.reset();
          assert(Number(court.dataset.zoom) === 1, 'Zoom-Reset funktioniert nicht');

          const snapshot = {
            elements: [
              { id: 'o1', type: 'offense', role: '1', x: 250, y: 390 },
              { id: 'd1', type: 'defense', role: 'X1', x: 220, y: 300 },
              { id: 'ball', type: 'ball', x: 265, y: 390 }
            ],
            transition: { motions: [], passes: [], screens: [] }
          };
          renderer.drawCourt(court, snapshot, { sourceStep: snapshot, showGuides: true });
          assert(court.querySelector('.offense-token'), '3D-Angreifer-Token fehlt');
          assert(court.querySelector('.defense-token'), '3D-Verteidiger-Token fehlt');
          assert(court.querySelector('.ball-token'), '3D-Ball fehlt');

          console.log('CourtHub Parallel Court: Zoom- und Parkett-Prüfungen erfolgreich.');
          """, encoding='utf-8')

          sw = Path('sw.js')
          sw.write_text(sw.read_text(encoding='utf-8').replace("courthub-v107", "courthub-v108", 1), encoding='utf-8')

          Path('docs/COURT_ZOOM_PARQUET_PLAN.md').write_text("""# Court-Zoom und Hallenparkett

          - parallele Seitenlinien statt trapezförmiger Verjüngung
          - orthografisch geneigte Court-Ansicht mit räumlichen Tokens
          - Pinch-Zoom, Zoom-Schaltflächen und Zurücksetzen
          - Zwei-Finger-Verschieben im vergrößerten Board
          - echtes Hallenparkett mit schmalen, versetzten Holzplanken statt breiter Streifen
          - gleiche Darstellung in Traineransicht, Spieleransicht, PDF und GIF
          """, encoding='utf-8')

          workflow = Path('.github/workflows/apply-court-zoom-parquet.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate
        run: |
          npm ci
          npm test

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add zoomable parallel parquet court"
          git push origin HEAD:agent/court-zoom-parquet
