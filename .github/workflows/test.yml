name: CourtHub Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test

  browser-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/courthub-e2e-server.log 2>&1 &
          echo $! > /tmp/courthub-e2e-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/courthub-e2e-server.log
          exit 1
      - name: Run browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          node scripts/browser-drag-probe.mjs
          node scripts/browser-e2e.mjs
