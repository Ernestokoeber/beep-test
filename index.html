<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#004b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CourtHub">
  <meta name="description" content="CourtHub verbindet Trainingsplanung, Leistungsdaten, Beep-Tests, Spielerentwicklung und Spielanalyse für Basketballteams.">
  <meta property="og:title" content="CourtHub · TSV Lindau Basketball">
  <meta property="og:description" content="Training planen, Spieler entwickeln und Teamleistung auswerten – mobil und offline nutzbar.">
  <meta property="og:image" content="assets/TSVLogotransparent.png">
  <meta property="og:type" content="website">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; worker-src 'self' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/TSVLogotransparent.png">
  <link rel="apple-touch-icon" href="assets/TSVLogotransparent.png">
  <title>CourtHub · TSV Lindau Basketball</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/inter-latin.woff2">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-head">
      <a href="#/dashboard" class="brand">
        <span class="brand-mark">
          <img src="assets/TSVLogotransparent.png" width="40" height="48" alt="TSV Lindau Basketball" class="brand-logo" decoding="async">
        </span>
        <span class="brand-copy">
          <span class="brand-kicker">TSV Lindau Basketball</span>
          <h1 class="brand-text">CourtHub</h1>
        </span>
      </a>
      <div class="topbar-actions">
        <button class="install-btn hidden" type="button" data-role="pwa-install" aria-label="App installieren">
          <span aria-hidden="true">↓</span><span class="install-label">Installieren</span>
        </button>
        <button class="theme-toggle" type="button" aria-label="Theme wechseln" data-role="theme-toggle">🌙</button>
        <a class="settings-btn" href="#/settings" aria-label="Einstellungen" title="Einstellungen">⚙️</a>
        <button class="hamburger" type="button" aria-label="Menü" aria-expanded="false" data-role="hamburger">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <nav data-role="nav" aria-label="App-Navigation">
      <span class="nav-section-label">Coaching</span>
      <a href="#/dashboard" data-nav="dashboard"><span class="nav-icon" aria-hidden="true">⌂</span><span>Dashboard</span></a>
      <a href="#/training" data-nav="training"><span class="nav-icon" aria-hidden="true">▶</span><span>Training</span></a>
      <a href="#/games" data-nav="games"><span class="nav-icon" aria-hidden="true">◉</span><span>Spiele &amp; Atlas</span></a>
      <a href="#/tablecrew" data-nav="tablecrew"><span class="nav-icon" aria-hidden="true">▤</span><span>Kampfgericht</span></a>
      <a href="#/test/setup" data-nav="setup"><span class="nav-icon" aria-hidden="true">◷</span><span>Beep-Test</span></a>
      <a href="#/players" data-nav="players"><span class="nav-icon" aria-hidden="true">◎</span><span>Spieler</span></a>
      <a href="#/reports" data-nav="reports"><span class="nav-icon" aria-hidden="true">▥</span><span>Auswertung</span></a>
      <span class="nav-section-label">Planung & Analyse</span>
      <a href="#/schedule" data-nav="schedule"><span class="nav-icon" aria-hidden="true">▦</span><span>Trainingsplan</span></a>
      <a href="#/drills" data-nav="drills"><span class="nav-icon" aria-hidden="true">◇</span><span>Drills</span></a>
      <a href="#/tactics" data-nav="tactics"><span class="nav-icon" aria-hidden="true">⌁</span><span>Taktikboard</span></a>
      <a href="#/notes" data-nav="notes"><span class="nav-icon" aria-hidden="true">□</span><span>Notizen</span></a>
      <a href="#/history" data-nav="history"><span class="nav-icon" aria-hidden="true">↺</span><span>Historie</span></a>
      <a href="#/account" data-nav="account"><span class="nav-icon" aria-hidden="true">◉</span><span>Konto & Sync</span></a>
      <a class="club-link" href="https://www.tsv-lindau.de" target="_blank" rel="noopener noreferrer"><span class="nav-icon" aria-hidden="true">↗</span><span>Vereinswebsite</span></a>
    </nav>
  </header>

  <main id="app"></main>

  <nav class="mobile-dock" aria-label="Schnellnavigation">
    <a href="#/dashboard" data-mobile-nav="dashboard"><span aria-hidden="true">⌂</span><small>Dashboard</small></a>
    <a href="#/training" data-mobile-nav="training"><span aria-hidden="true">▶</span><small>Training</small></a>
    <a class="mobile-dock-main" href="#/test/setup" data-mobile-nav="setup"><span aria-hidden="true">⌁</span><small>Beep-Test</small></a>
    <a href="#/players" data-mobile-nav="players"><span aria-hidden="true">◎</span><small>Spieler</small></a>
    <a href="#/account" data-mobile-nav="account"><span aria-hidden="true">⚙</span><small>Konto &amp; Sync</small></a>
  </nav>

  <template id="tpl-dashboard">
    <section class="view dashboard-view">
      <section class="coach-hero" aria-labelledby="coach-hero-title">
        <div class="coach-hero-copy">
          <span class="coach-eyebrow">Coaching Center</span>
          <h2 id="coach-hero-title">Bereit fürs<br>nächste Training?</h2>
          <div class="coach-hero-actions">
            <a class="hero-action hero-action-primary" href="#/schedule"><span aria-hidden="true">▣</span><strong>Training planen</strong></a>
            <a class="hero-action hero-action-secondary" href="#/tactics"><span aria-hidden="true">⌗</span><strong>Taktikboard öffnen</strong></a>
          </div>
          <div class="coach-status-row">
            <span class="connection-chip" data-role="connection-status"><i></i><span>Online</span></span>
            <span class="today-chip" data-role="dashboard-date"></span>
          </div>
        </div>
        <div class="coach-hero-visual" aria-hidden="true">
          <svg viewBox="0 0 360 250" role="presentation">
            <g class="hero-court-lines" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M80 20h245v205H80z"/>
              <path d="M80 72h74v101H80M154 72a51 51 0 0 1 0 101"/>
              <path d="M80 104h36v37H80M116 123h15"/>
              <path d="M265 20v46"/>
              <path class="hero-play-accent" d="M205 100c-18 18-12 40 12 49"/>
              <path class="hero-play-accent" d="m211 141 7 8-10 4"/>
              <path d="M249 150c17 10 24 3 28-13"/>
              <path d="m270 139 8-5 2 9"/>
            </g>
            <g class="hero-markers" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
              <path d="m194 67 12 12m0-12-12 12m51-9 12 12m0-12-12 12m-51 99 12 12m0-12-12 12m69-14 12 12m0-12-12 12"/>
              <circle cx="296" cy="69" r="8"/><circle cx="227" cy="195" r="8"/><circle cx="302" cy="190" r="8"/>
            </g>
            <g class="hero-ball" transform="translate(26 148)">
              <circle cx="51" cy="51" r="46"/>
              <path d="M9 38c28 2 55 28 67 54M27 10c2 29 26 60 64 69M13 73c29-18 57-20 83-5M67 8c-17 27-20 57-8 87"/>
            </g>
          </svg>
        </div>
        <button class="hero-install hidden" type="button" data-role="pwa-install">CourtHub installieren</button>
      </section>

      <div class="dash-grid preview-kpi-grid">
        <a class="dash-card preview-kpi-card" data-role="next-training-card" href="#/schedule" aria-label="Nächstes Training öffnen">
          <div class="dash-label">Nächstes Training</div>
          <svg class="dash-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h3v3H8z"/></svg>
          <div class="dash-big dash-big-copy" data-role="next-training-time">Noch offen</div>
          <div class="dash-sub" data-role="next-training-place">Training planen</div>
          <span class="hidden" data-role="trainings-count">0</span>
          <span class="hidden" data-role="next-training"></span>
        </a>
        <a class="dash-card preview-kpi-card" href="#/players" aria-label="Spielerliste öffnen">
          <div class="dash-label">Spieler</div>
          <svg class="dash-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M15 14a5 5 0 0 1 6 5v1"/></svg>
          <div class="dash-big" data-role="player-count">0</div>
          <div class="dash-sub">im Team</div>
        </a>
        <a class="dash-card preview-kpi-card" href="#/reports" aria-label="Anwesenheitsauswertung öffnen">
          <div class="dash-label">Anwesenheit</div>
          <svg class="dash-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 10-4.5"/><circle cx="17" cy="16" r="4"/><path d="m15.5 16 1 1 2-2"/></svg>
          <div class="dash-big"><span data-role="team-att-pct">0</span>%</div>
          <div class="dash-sub" data-role="team-att-sub">Team Ø</div>
        </a>
        <a class="dash-card preview-kpi-card" href="#/reports" aria-label="Wurfquoten-Auswertung öffnen">
          <div class="dash-label">Freiwürfe</div>
          <svg class="dash-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v9H5zM8 13l1 7h6l1-7M9 16h6M12 13v7"/><circle cx="12" cy="9" r="2"/></svg>
          <div class="dash-big"><span data-role="team-ft-pct">0</span>%</div>
          <div class="dash-sub" data-role="team-ft-sub">Team Ø</div>
        </a>
      </div>

      <section class="next-training-panel" data-role="next-training-panel">
        <div class="next-training-panel-head">
          <div>
            <span class="section-kicker">Planung</span>
            <h3>Nächstes Training</h3>
          </div>
          <a class="btn small" href="#/schedule">Plan bearbeiten</a>
        </div>
        <div class="next-training-agenda" data-role="next-training-agenda"></div>
      </section>

      <details class="dashboard-tools">
        <summary>Daten, Saison und Export</summary>
        <div class="dashboard-tools-row">
          <label class="season-select"><span class="sr-only">Saison</span><select data-role="season-select"></select></label>
          <button class="btn small" data-action="share-backup">Backup teilen</button>
          <button class="btn small" data-action="import-backup">Importieren</button>
          <button class="btn small" data-action="export-season-csv">Saison CSV</button>
          <button class="btn small" data-action="export-season-json">Saison JSON</button>
        </div>
      </details>

      <a class="next-game-strip" href="#/games">
        <span><small>Nächstes Spiel</small><strong data-role="next-game-opponent">Spielplan öffnen</strong></span>
        <span data-role="next-game-meta">Spiele &amp; Atlas →</span>
      </a>

      <section class="phase-banner hidden" data-role="phase-banner">
        <div class="phase-banner-top">
          <span class="phase-banner-badge" data-role="phase-banner-badge"></span>
          <span class="phase-banner-focus" data-role="phase-banner-focus"></span>
          <span class="phase-banner-days" data-role="phase-banner-days"></span>
        </div>
        <div class="phase-banner-bar-wrap">
          <div class="phase-banner-bar" data-role="phase-banner-bar"></div>
        </div>
        <ul class="phase-banner-goals hidden" data-role="phase-banner-goals"></ul>
        <button class="phase-banner-toggle" type="button" data-action="toggle-phase-goals">Ziele anzeigen</button>
      </section>

      <section class="alerts-card hidden" data-role="alerts">
        <h3 class="alerts-head">🔔 Heute beachten</h3>
        <ul class="alerts-list" data-role="alerts-list"></ul>
      </section>

      <section class="coach-briefing" data-role="coach-briefing">
        <div class="coach-briefing-head">
          <div>
            <span class="section-kicker">Nächster Einsatz</span>
            <h3>Trainerbriefing</h3>
          </div>
          <button class="btn small" type="button" data-action="share-briefing">Briefing teilen</button>
        </div>
        <div class="coach-briefing-grid" data-role="coach-briefing-grid"></div>
        <ul class="coach-briefing-list" data-role="coach-briefing-list"></ul>
      </section>

      <section class="form-of-week hidden" data-role="form-of-week">
        <h3 class="form-of-week-head">📈 Form der Woche</h3>
        <div class="form-of-week-grid" data-role="form-of-week-grid"></div>
      </section>

      <h3>Top Anwesende</h3>
      <ol class="ranking" data-role="top-att"></ol>

      <h3>Top Freiwurf-Schützen <span class="muted-chip">(min. 10 Versuche)</span></h3>
      <ol class="ranking" data-role="top-ft"></ol>
      <div class="empty empty--field hidden" data-role="top-ft-empty">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 17 4-8 4 4 6-8"/></svg>
        <p class="empty-body">Noch kein Schütze mit 10+ Versuchen.</p>
      </div>

      <h3>Wurfquoten pro Kategorie</h3>
      <div data-role="shot-cats"></div>
      <div class="empty empty--field hidden" data-role="shot-cats-empty">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 17 4-8 4 4 6-8"/></svg>
        <p class="empty-body">Noch keine Wurf-Daten.</p>
      </div>

      <div class="pos-head">
        <h3>Stats pro Position</h3>
        <label class="pos-sort-label">
          <span class="sr-only">Sortierung</span>
          <select data-role="position-sort">
            <option value="position">Position (PG → C)</option>
            <option value="players">Anzahl Spieler</option>
            <option value="ft">Freiwürfe %</option>
            <option value="fg">Feldwürfe %</option>
            <option value="attendance">Anwesenheit %</option>
          </select>
        </label>
      </div>
      <div class="position-grid" data-role="position-grid"></div>
      <div class="empty empty--field hidden" data-role="position-empty">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        <p class="empty-body">Noch keine Positionen erfasst. Trage Positionen in den Spieler-Profilen ein.</p>
      </div>

      <h3>Team-Wurfkarte (Saison)</h3>
      <p class="muted" data-role="team-heat-meta"></p>
      <div class="court-wrap" data-role="team-heat-wrap">
        <svg class="court" viewBox="0 0 500 470" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
          <rect class="court-floor" x="10" y="10" width="480" height="450" stroke-width="2"/>
          <rect class="court-lane" x="160" y="10" width="180" height="190" stroke-width="2"/>
          <circle class="court-line" cx="250" cy="200" r="60" fill="none" stroke-width="2"/>
          <line class="court-line" x1="160" y1="200" x2="340" y2="200" stroke-width="2"/>
          <path class="court-line" d="M 210 50 A 40 40 0 0 0 290 50" fill="none" stroke-width="1.5"/>
          <line class="court-backboard" x1="220" y1="40" x2="280" y2="40" stroke-width="3"/>
          <circle class="court-rim" cx="250" cy="50" r="8" fill="none" stroke-width="2.5"/>
          <line class="court-line" x1="50" y1="10" x2="50" y2="135" stroke-width="2"/>
          <line class="court-line" x1="450" y1="10" x2="450" y2="135" stroke-width="2"/>
          <path class="court-line" d="M 50 135 A 200 200 0 0 0 450 135" fill="none" stroke-width="2"/>
          <g data-role="team-heat-cells"></g>
        </svg>
      </div>
      <div class="empty empty--field hidden" data-role="team-heat-empty">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-5"/></svg>
        <p class="empty-body">Noch keine Würfe auf der Karte erfasst.</p>
      </div>
    </section>
  </template>

  <template id="tpl-reports">
    <section class="view reports-view">
      <div class="section-head reports-head">
        <div class="section-title-block">
          <span class="section-kicker">Gesamter Datenstand</span>
          <h2>Auswertung</h2>
          <p class="muted">Training, Spiele, Project Atlas und Beep-Test in einer aktuellen Teamübersicht.</p>
        </div>
        <div class="head-actions">
          <button class="btn" type="button" data-action="report-csv">CSV exportieren</button>
          <button class="btn primary" type="button" data-action="report-pdf">PDF exportieren</button>
        </div>
      </div>

      <div class="report-filter-bar">
        <label>Saison
          <select data-role="report-season"></select>
        </label>
        <label>Spieler
          <select data-role="report-player"><option value="all">Alle Spieler</option></select>
        </label>
        <span class="report-as-of" data-role="report-as-of"></span>
      </div>

      <div class="report-summary-grid" data-role="report-summary"></div>
      <section class="report-coverage" data-role="report-coverage"></section>

      <section class="report-panel">
        <div class="report-panel-head">
          <div><span class="section-kicker">Teamleistung</span><h3>Wurfquoten und Spiele</h3></div>
        </div>
        <div class="report-team-grid" data-role="report-team"></div>
        <div class="report-category-grid" data-role="report-categories"></div>
      </section>

      <section class="report-panel">
        <div class="report-panel-head">
          <div><span class="section-kicker">Kader</span><h3>Komplette Spielerübersicht</h3></div>
          <span class="muted" data-role="report-player-count"></span>
        </div>
        <div class="table-scroll report-table-scroll">
          <table class="results report-player-table">
            <thead>
              <tr><th>Spieler</th><th>Anwesenheit</th><th>Training FG</th><th>Training FT</th><th>Spiele</th><th>PPG</th><th>Spiel FG</th><th>Spiel FT</th><th>REB</th><th>AST</th><th>TO</th><th>Beep-Test</th></tr>
            </thead>
            <tbody data-role="report-player-rows"></tbody>
          </table>
        </div>
        <div class="empty empty--field hidden" data-role="report-empty"><p class="empty-body">Für diese Auswahl liegen noch keine Spieler vor.</p></div>
      </section>

      <section class="report-panel">
        <div class="report-panel-head">
          <div><span class="section-kicker">Wurfprofil</span><h3>Wurfquoten jedes Spielers</h3></div>
        </div>
        <div class="report-player-cards" data-role="report-player-cards"></div>
      </section>
    </section>
  </template>

  <template id="tpl-players">
    <section class="view">
      <div class="section-head">
        <h2>Spielerverwaltung</h2>
        <button class="btn primary" data-action="new-player">+ Neuer Spieler</button>
      </div>

      <form class="player-form hidden" data-role="player-form">
        <input type="hidden" name="id">
        <div class="form-row">
          <label>Name *<input name="name" type="text" required maxlength="60"></label>
          <label>Geburtsdatum<input name="birthDate" type="date"></label>
          <label>Position<input name="position" type="text" maxlength="40" placeholder="z.B. Mittelfeld"></label>
          <label>Trikotnummer<input name="jerseyNumber" type="text" maxlength="8" placeholder="z.B. 11"></label>
          <label>Project-Atlas-ID<input name="atlasPlayerId" type="text" maxlength="100" placeholder="z.B. player-11"></label>
          <label>Verfügbarkeit
            <select name="availability">
              <option value="ready">Einsatzbereit</option>
              <option value="limited">Eingeschränkt</option>
              <option value="injured">Verletzt</option>
              <option value="away">Abwesend</option>
            </select>
          </label>
          <label>Status bis<input name="availabilityUntil" type="date"></label>
        </div>
        <label class="block-label">Hinweis für das Trainerteam
          <input name="availabilityNote" type="text" maxlength="160" placeholder="z.B. Sprunggelenk – nur kontaktfrei">
        </label>
        <div class="form-actions">
          <button type="submit" class="btn primary">Speichern</button>
          <button type="button" class="btn" data-action="cancel">Abbrechen</button>
        </div>
      </form>

      <div class="tabs">
        <button class="tab active" data-tab="active">Aktiv</button>
        <button class="tab" data-tab="archived">Archiv</button>
      </div>

      <ul class="player-list" data-role="player-list"></ul>
      <div class="empty hidden" data-role="empty">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        <p class="empty-headline">Noch keine Spieler angelegt</p>
        <p class="empty-body">Leg deinen ersten Spieler an, um loszulegen.</p>
        <button class="btn primary" data-action="new-player">+ Neuer Spieler</button>
      </div>
    </section>
  </template>

  <template id="tpl-setup">
    <section class="view">
      <div class="section-head">
        <h2>Test vorbereiten</h2>
        <a href="#/players" class="btn">← Zurück</a>
      </div>
      <form class="setup-form" data-role="setup-form">
        <div class="form-row">
          <label>Datum<input name="date" type="date" required></label>
          <label>Rundenlänge (m)<input name="distance" type="number" min="5" max="50" step="0.5" required></label>
          <label class="grow">Notiz<input name="note" type="text" maxlength="100" placeholder="z.B. Vorbereitungstraining"></label>
        </div>
        <div class="test-type-row">
          <label class="test-type-opt">
            <input type="radio" name="testType" value="leger" checked>
            <div>
              <div class="tt-name">Beep-Test (Léger)</div>
              <div class="tt-desc">Standard Multistage Shuttle Run · Start 8 km/h · Dauer-Beep ohne Pausen</div>
            </div>
          </label>
          <label class="test-type-opt">

          <line class="court-line" x1="160" y1="200" x2="340" y2="200" stroke-width="2"/>

          <line class="court-backboard" x1="220" y1="40" x2="280" y2="40" stroke-width="3"/>
          <circle class="court-rim" cx="250" cy="50" r="8" fill="none" stroke-width="2.5"/>
          <line class="court-line" x1="50" y1="10" x2="50" y2="135" stroke-width="2"/>
          <line class="court-line" x1="450" y1="10" x2="450" y2="135" stroke-width="2"/>
          <path class="court-line" d="M 50 135 A 200 200 0 0 0 450 135" fill="none" stroke-width="2"/>
          <g data-role="arrows-layer"></g>
          <g data-role="texts-layer"></g>
          <g data-role="tokens-layer"></g>
        </svg>
      </div>

      <div class="tactics-legend muted">O · Angriff (1–5) · ⬤ Ball · Laufweg (grün durchgezogen) · Passweg (orange gestrichelt)</div>
    </section>
  </template>

  <template id="tpl-tactics-ai-modal">
    <div class="modal-backdrop">
      <div class="modal" role="dialog" aria-label="KI-Erklärung">
        <div class="modal-head">
          <h3>🤖 KI-Erklärung</h3>
          <button type="button" class="btn small" data-action="close" aria-label="Schließen">✕</button>
        </div>
        <div class="modal-body">
          <p class="muted" data-role="status">Erklärung wird erzeugt …</p>
          <div class="tactics-ai-text" data-role="text" hidden></div>
          <div class="modal-foot">
            <button type="button" class="btn" data-action="close">Schließen</button>
            <button type="button" class="btn primary" data-action="save-note" disabled>Als Notiz speichern</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-tactics-gif-modal">
    <div class="modal-backdrop">
      <div class="modal" role="dialog" aria-label="GIF teilen">
        <div class="modal-head">
          <h3>📤 Als GIF teilen</h3>
          <button type="button" class="btn small" data-action="close" aria-label="Schließen">✕</button>
        </div>
        <div class="modal-body">
          <p class="muted">Geschwindigkeit pro Schritt wählen:</p>
          <div class="gif-speed-options">
            <label><input type="radio" name="gifspeed" value="kept" checked> Wie eingestellt (pro Schritt)</label>
            <label><input type="radio" name="gifspeed" value="3"> Langsam (3 s pro Schritt)</label>
            <label><input type="radio" name="gifspeed" value="1.5"> Mittel (1,5 s pro Schritt)</label>
            <label><input type="radio" name="gifspeed" value="0.7"> Schnell (0,7 s pro Schritt)</label>
          </div>
          <p class="muted" data-role="status" hidden></p>
          <div class="modal-foot">
            <button type="button" class="btn" data-action="close">Abbrechen</button>
            <button type="button" class="btn primary" data-action="render-gif">GIF erzeugen</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-template-picker">
    <div class="modal-backdrop" data-role="modal-backdrop">
      <div class="modal" role="dialog" aria-label="Trainings-Template laden">
        <div class="modal-head">
          <h3>Trainings-Template laden</h3>
          <button type="button" class="btn small" data-action="close" aria-label="Schließen">✕</button>
        </div>
        <div class="modal-body">
          <p class="muted ps-small">Ersetzt Plan, Freiwurfzahl und Wurfkategorien dieses Trainings.</p>
          <ul class="template-list" data-role="list"></ul>
          <p class="empty hidden" data-role="empty">Keine Templates gespeichert. Erstelle eins über „💾 Als Template speichern" aus einem bestehenden Training.</p>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-player-stats-modal">
    <div class="modal-backdrop" data-role="modal-backdrop">
      <div class="modal player-stats-modal" role="dialog" aria-label="Spieler-Statistik">
        <div class="modal-head">
          <h3 data-role="title">Spieler</h3>
          <button type="button" class="btn small" data-action="close" aria-label="Schließen">✕</button>
        </div>
        <div class="modal-body">
          <div class="ps-subtitle muted" data-role="subtitle"></div>
          <div class="ps-content" data-role="content"></div>
          <div class="modal-foot">
            <button type="button" class="btn primary" data-action="share-report">📄 Report teilen</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-drill-picker">
    <div class="modal-backdrop" data-role="modal-backdrop">
      <div class="modal" role="dialog" aria-label="Drill aus Bibliothek">
        <div class="modal-head">
          <h3>Drill aus Bibliothek</h3>
          <button type="button" class="btn small" data-action="close" aria-label="Schließen">✕</button>
        </div>
        <div class="modal-body">
          <div class="drill-filters">
            <input type="search" class="search-input" data-role="search" placeholder="Suchen …">
            <select data-role="category-filter"></select>
          </div>
          <ul class="drill-list" data-role="list"></ul>
          <p class="empty hidden" data-role="empty">Keine Drills in der Bibliothek. <a href="#/drills">Jetzt anlegen</a>.</p>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-settings">
    <section class="view">
      <div class="section-head">
        <div class="head-left">
          <a href="#/dashboard" class="btn">← Zurück</a>
          <h2>Einstellungen</h2>
        </div>
      </div>

      <h3>Wurf-Spots (global)</h3>
      <p class="muted">Wähle eine Kategorie und tippe auf die Karte wo die Spieler dafür werfen. Gilt für alle Trainings, wird beim automatischen Befüllen der Wurfkarte benutzt.</p>

      <div class="settings-spots">
        <div class="spot-cat-list" data-role="spot-cat-list"></div>
        <div class="court-wrap">
          <svg class="court" viewBox="0 0 500 470" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" data-role="settings-spot-svg">
            <rect class="court-floor" x="10" y="10" width="480" height="450" stroke-width="2"/>
            <rect class="court-lane" x="160" y="10" width="180" height="190" stroke-width="2"/>
            <circle class="court-line" cx="250" cy="200" r="60" fill="none" stroke-width="2"/>
            <line class="court-line" x1="160" y1="200" x2="340" y2="200" stroke-width="2"/>
            <path class="court-line" d="M 210 50 A 40 40 0 0 0 290 50" fill="none" stroke-width="1.5"/>
            <line class="court-backboard" x1="220" y1="40" x2="280" y2="40" stroke-width="3"/>
            <circle class="court-rim" cx="250" cy="50" r="8" fill="none" stroke-width="2.5"/>
            <line class="court-line" x1="50" y1="10" x2="50" y2="135" stroke-width="2"/>
            <line class="court-line" x1="450" y1="10" x2="450" y2="135" stroke-width="2"/>
            <path class="court-line" d="M 50 135 A 200 200 0 0 0 450 135" fill="none" stroke-width="2"/>
            <g data-role="settings-spot-markers"></g>
            <rect x="10" y="10" width="480" height="450" fill="transparent" data-role="settings-spot-hit"/>
          </svg>
        </div>
        <div class="spot-editor-controls">
          <label class="muted">Streuung (Radius): <input type="range" min="6" max="60" step="2" data-role="settings-spot-radius" value="22"> <span data-role="settings-spot-radius-val">22</span></label>
          <button type="button" class="btn small danger" data-action="settings-clear-spot">Spot der Kategorie löschen</button>
          <button type="button" class="btn small" data-action="settings-add-cat">+ Neue Kategorie</button>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-account">
    <section class="view account-view">
      <div class="section-head">
        <div class="section-title-block">
          <span class="section-kicker">Sicher auf allen Geräten</span>
          <h2>Konto &amp; Synchronisierung</h2>
        </div>
      </div>

      <section class="account-hero">
        <div>
          <span class="coach-eyebrow">TSV Team-Workspace</span>
          <h3>Ein gemeinsamer Datenstand für das Trainerteam.</h3>
          <p>Trainings, Spieler, Statistiken und Pläne bleiben offline verfügbar und werden nach der Anmeldung verschlüsselt über HTTPS synchronisiert.</p>
        </div>
        <div class="sync-indicator" data-role="sync-indicator">
          <i></i><span data-role="sync-label">Gastmodus</span>
        </div>
      </section>

      <section class="appearance-card">
        <div>
          <span class="section-kicker">Darstellung</span>
          <h3>Hell- oder Dunkelmodus</h3>
          <p class="muted">Die Einstellung gilt auf diesem Gerät. „System“ übernimmt automatisch die iPhone- oder Browser-Einstellung.</p>
        </div>
        <div class="theme-choice" role="group" aria-label="Farbschema">
          <button type="button" data-theme-choice="light">☀ Hell</button>
          <button type="button" data-theme-choice="dark">☾ Dunkel</button>
          <button type="button" data-theme-choice="system">◐ System</button>
        </div>
      </section>

      <div class="account-guest" data-role="account-guest">
        <div class="auth-grid">
          <form class="auth-card" data-role="login-form">
            <span class="auth-card-number">01</span>
            <h3>Anmelden</h3>
            <p class="muted">Vorhandenes Trainerkonto verwenden.</p>
            <label class="block-label">E-Mail
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <label class="block-label">Passwort
              <input name="password" type="password" autocomplete="current-password" minlength="10" required>
            </label>
            <button class="btn primary" type="submit">Anmelden</button>
          </form>

          <form class="auth-card" data-role="register-form">
            <span class="auth-card-number">02</span>
            <h3>Trainerkonto anlegen</h3>
            <p class="muted">Das reservierte erste TSV-Konto wird Administrator. Weitere Konten benötigen den Einladungscode.</p>
            <label class="block-label">Name
              <input name="displayName" type="text" autocomplete="name" minlength="2" maxlength="80" required>
            </label>
            <label class="block-label">E-Mail
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <label class="block-label">Passwort
              <input name="password" type="password" autocomplete="new-password" minlength="10" required>
            </label>
            <label class="block-label">Einladungscode <span class="muted">(für weitere Konten)</span>
              <input name="inviteCode" type="password" autocomplete="off">
            </label>
            <button class="btn primary" type="submit">Konto erstellen</button>
          </form>
        </div>
        <p class="auth-status" data-role="auth-status" aria-live="polite"></p>
      </div>

      <section class="account-session hidden" data-role="account-session">
        <div class="account-profile-card">
          <div class="account-avatar" data-role="account-avatar">TS</div>
          <div>
            <span class="account-role" data-role="account-role"></span>
            <h3 data-role="account-name"></h3>
            <p class="muted" data-role="account-email"></p>
          </div>
        </div>
        <div class="account-details">
          <div><span>Team</span><strong data-role="account-team">—</strong></div>
          <div><span>Letzte Synchronisierung</span><strong data-role="last-sync">—</strong></div>
          <div><span>Workspace-Version</span><strong data-role="workspace-version">0</strong></div>
        </div>
        <div class="form-actions">
          <button class="btn primary" type="button" data-action="sync-now">Jetzt synchronisieren</button>
          <button class="btn" type="button" data-action="logout">Abmelden</button>
        </div>
        <p class="auth-status" data-role="session-status" aria-live="polite"></p>
        <section class="team-members-card">
          <div class="section-head">
            <div>
              <span class="section-kicker">Berechtigungen</span>
              <h3>Trainerteam</h3>
            </div>
          </div>
          <p class="muted">Administratoren können Rollen ändern. Lesender Zugriff darf die gemeinsamen Teamdaten nicht überschreiben.</p>
          <div class="team-members-list" data-role="team-members"></div>
          <p class="auth-status" data-role="members-status" aria-live="polite"></p>
        </section>
      </section>
    </section>
  </template>
